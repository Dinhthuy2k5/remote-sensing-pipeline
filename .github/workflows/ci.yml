name: CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "cpp-core/**"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "cpp-core/**"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"

jobs:
  detect-changes:
    name: Detect which parts changed
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      cpp: ${{ steps.filter.outputs.cpp }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'frontend/**'
            cpp:
              - 'cpp-core/**'
              - 'docker-compose.yml'

  build-frontend:
    name: Build frontend (React + Vite)
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (if configured)
        run: npm run lint --if-present

      - name: Build
        run: npm run build

  build-cpp-core:
    name: Build C++ core (Docker)
    needs: detect-changes
    if: needs.detect-changes.outputs.cpp == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build cpp-core image (builder stage)
        run: docker build --target builder -t rs-pipeline-builder cpp-core

      - name: Run StateMachine unit test
        run: docker run --rm rs-pipeline-builder /app/build/test_state_machine

  build-full-stack:
    name: Build full docker-compose stack
    needs: [detect-changes, build-cpp-core]
    if: needs.detect-changes.outputs.cpp == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build postgis + cpp-core services
        run: docker compose build postgis cpp-core