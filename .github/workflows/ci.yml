name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-frontend:
    name: Build frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (if configured)
        run: npm run lint --if-present

      - name: Build
        run: npm run build

  build-cpp-core:
    name: Build C++ core (Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build cpp-core image (builder stage)
        run: docker build --target builder -t rs-pipeline-builder cpp-core

      - name: Run StateMachine unit test
        run: docker run --rm rs-pipeline-builder /app/build/test_state_machine

  build-full-stack:
    name: Build full docker-compose stack
    runs-on: ubuntu-latest
    needs: [build-cpp-core]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build postgis + cpp-core services
        run: docker compose build postgis cpp-core