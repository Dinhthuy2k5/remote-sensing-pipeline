name: "CodeQL"

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/codeql.yml"
  schedule:
    # Quét định kỳ toàn bộ frontend mỗi thứ Hai, 3:00 sáng UTC,
    # để bắt lỗ hổng mới phát hiện trong dependency dù không có commit mới
    - cron: '0 3 * * 1'

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  # C++ tạm thời tắt: CodeQL cần trace trực tiếp lệnh biên dịch trên
  # runner, nhưng build hiện tại chạy qua "docker build" nên tracer
  # không theo dõi được -> job luôn fail. Cần build C++ trực tiếp trên
  # runner (cài GDAL/ONNX Runtime/libpqxx, không qua Docker) mới bật lại được.