name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Chạy định kỳ mỗi thứ Hai, 3:00 sáng UTC, để bắt lỗ hổng mới phát hiện
    # trong dependency ngay cả khi không có commit mới
    - cron: '0 3 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # C++ cần build-mode "manual" nên phải tự chạy lệnh build để CodeQL
      # theo dõi quá trình biên dịch và phân tích mã máy sinh ra
      - name: Build C++ core (manual build mode)
        if: matrix.language == 'c-cpp'
        run: docker build --target builder -t rs-pipeline-builder cpp-core

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"